name: Publish

# The manual path: a tag pushed by hand, for a release made outside
# release-please. The automated path inlines these same steps in
# release-please.yml, because PyPI cannot use a reusable workflow as a
# trusted publisher. Each file therefore needs its own publisher registered
# on PyPI, naming that file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      # Catches the case where the tag was moved or created off the wrong
      # commit; publishing a mislabelled version to PyPI cannot be undone.
      - name: Verify the tag matches the packaged version
        run: |
          set -euo pipefail
          packaged=$(uv version --short)
          expected="${TAG#v}"
          if [ "$packaged" != "$expected" ]; then
            echo "::error::tag $TAG does not match the packaged version $packaged"
            exit 1
          fi

      - name: Build
        run: uv build

      # A broken sdist or a README that PyPI refuses to render otherwise only
      # surfaces at upload time, once the tag already exists.
      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aioplatega
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so
      # there is no long-lived API token to store or rotate.
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-artifacts:
    name: Attach distributions to the release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # release-please writes the release and its notes from the commit
      # messages; this only adds the built files to it. `generate_release_notes`
      # would overwrite that changelog with GitHub's own list of PRs.
      - name: Attach files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
