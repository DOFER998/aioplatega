name: Release

# release-please keeps a Release PR open against main, accumulating the
# conventional-commit messages since the last tag. Merging that PR is the
# release: it bumps the version, writes CHANGELOG.md, tags, and creates the
# GitHub release. Only then does anything reach PyPI.
#
# The publish steps are inlined rather than delegated to pypi-release.yml,
# because PyPI states plainly that "reusable workflows cannot currently be
# used as the workflow in a Trusted Publisher". Called that way the OIDC
# token authenticates on job_workflow_ref (the callee) while the attestation
# certificate records workflow_ref (the caller), and the two cannot both
# match one publisher.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # uv.lock records the project's own version beside every dependency, so
      # a release that touches pyproject.toml alone leaves `uv sync --locked`
      # failing on every workflow. release-please updates the files its python
      # strategy knows about, and a lockfile from a tool that postdates the
      # strategy is not among them. Re-locking on its branch keeps the two in
      # step without depending on an updater matching the file's shape.
      - uses: actions/checkout@v7
        if: steps.release.outputs.pr
        with:
          fetch-depth: 0

      - name: Install uv
        if: steps.release.outputs.pr
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync uv.lock on the release branch
        if: steps.release.outputs.pr
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(echo "$PR" | jq -r .headBranchName)
          git fetch origin "$branch"
          git checkout "$branch"
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock already matches the released version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock with the released version" uv.lock
          git push origin "$branch"

  build:
    name: Build distribution
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      # Catches a tag moved or cut from the wrong commit. Publishing a
      # mislabelled version to PyPI cannot be undone.
      - name: Verify the tag matches the packaged version
        run: |
          set -euo pipefail
          packaged=$(uv version --short)
          expected="${TAG#v}"
          if [ "$packaged" != "$expected" ]; then
            echo "::error::tag $TAG does not match the packaged version $packaged"
            exit 1
          fi
        env:
          TAG: ${{ needs.release-please.outputs.tag }}

      - name: Build
        run: uv build

      # A broken sdist or a README PyPI refuses to render otherwise surfaces
      # only at upload time, once the tag already exists.
      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aioplatega
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so
      # there is no long-lived API token to store or rotate. The publisher
      # registered on PyPI must name this file.
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-artifacts:
    name: Attach distributions to the release
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # release-please writes the release notes from the commit messages;
      # this only adds the built files. generate_release_notes would replace
      # that changelog with GitHub's own list of merged PRs.
      - name: Attach files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag }}
          files: dist/*
