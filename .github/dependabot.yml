version: 2

updates:
  # The workflows had drifted several major versions behind before this file
  # existed; keeping actions on the update schedule is the point.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore
    groups:
      # One PR per group instead of one per package: the seven open dependabot
      # branches this replaces were almost all transitive bumps.
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
      runtime-dependencies:
        dependency-type: production
        patterns: ["*"]
